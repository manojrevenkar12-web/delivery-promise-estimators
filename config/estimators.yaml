# The estimators: models, which quantile goes to the planner, retraining, the gate, drift, fallback.
quantiles: [0.5, 0.6, 0.7, 0.8, 0.9]   # one multi-quantile model serves all of them
service_quantile: 0.6           # chosen on the development hubs by replaying the planner (reports/sweep.json)
travel_quantile: 0.6
availability_quantile: 0.2      # roster until the 20th percentile of expected shows covers the plan (reports/sweep.json)
selection:                      # how the replay picks the percentiles: the cheapest pair that turns away at most
  max_reject_share: 0.06        # this share of orders (a service level set by the business, not by the model)
training_window_days: 28
half_life_days: 10             # recent days weigh more: a row 10 days old counts half
retrain_every_days: 7
gate:
  validation_days: 3            # weekly: the challenger leaves the last 3 days out and is judged on them
  validation_days_fast: 1       # after a drift alarm: retrain daily for a few days, judged on the last day
  fast_days: 5
  max_pinball_regression: 0.02  # a challenger may not be more than 2% worse than the champion
drift:
  coverage_band: 0.10           # alarm when actuals fall under the served quantile this much less often
  alarm_days: 2                 # on consecutive days
xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.06
  subsample: 0.9
  min_child_weight: 4
