[project]
name = "delivery-promise-estimators"
version = "0.1.0"
requires-python = ">=3.12"
description = "Route-planning estimators and picking optimisation for 120-minute grocery delivery, measured on simulated hubs."

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "SIM108", "E741", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
